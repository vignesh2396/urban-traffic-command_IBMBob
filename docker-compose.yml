version: "3.9"

services:
  urbanpulse:
    build: .
    container_name: urbanpulse
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rag/chroma_store:/app/rag/chroma_store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
